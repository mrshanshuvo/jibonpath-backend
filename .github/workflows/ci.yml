name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-guard:
    name: Supply Chain Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for Supply Chain Injection Artifacts
        run: |
          set -e
          echo "Running Supply Chain Security Audit..."

          # 1. Check for prohibited attack & tracking artifacts
          PROHIBITED_FILES=("init" "api.js" "branch_structure.json" "config.bat" "temp_auto_push.bat" "temp_interactive_push.bat")
          for f in "${PROHIBITED_FILES[@]}"; do
            if [ -e "$f" ]; then
              echo "🚨 CRITICAL: Known supply-chain attack artifact detected: $f"
              exit 1
            fi
          done

          # 2. Check for hidden wfx-loot / probe scripts
          if ls .ci-* 1> /dev/null 2>&1; then
            echo "🚨 CRITICAL: Detected suspicious .ci-* script pattern!"
            exit 1
          fi

          # 3. Verify package.json integrity (scripts must not execute init or api.js)
          if grep -E "node init|node api\.js" package.json; then
            echo "🚨 CRITICAL: Malicious execution hook detected in package.json!"
            exit 1
          fi

          # 4. Check for accidental secret .env tracking
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "🚨 CRITICAL: Root .env secret file is tracked in git!"
            exit 1
          fi

          echo "✅ Supply Chain Security Audit PASSED! All integrity checks clean."

  test-and-lint:
    name: Build, Lint & Test
    needs: [security-guard]
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/testdb' }}
      JWT_SECRET: "test-jwt-secret-key-32-chars-long-here"
      JWT_REFRESH_SECRET: "test-jwt-refresh-secret-key-32-chars"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      BKASH_BASE_URL: "https://tokenized.sandbox.bka.sh/v1.2.0-beta"
      BKASH_APP_KEY: "test_key"
      BKASH_APP_SECRET: "test_secret"
      BKASH_USERNAME: "sandboxTokenizedUser02"
      BKASH_PASSWORD: "test_password"
      BKASH_CALLBACK_URL: "http://localhost:5000/api/v1/payments/bkash/callback"
      SSLCOMMERZ_STORE_ID: "emerg6a993ce356e43"
      SSLCOMMERZ_STORE_PASSWORD: "test_store_password"
      SSLCOMMERZ_IS_LIVE: false
      SSLCOMMERZ_SESSION_URL: "https://sandbox.sslcommerz.com/gwprocess/v4/api.php"
      SSLCOMMERZ_VALIDATION_URL: "https://sandbox.sslcommerz.com/validator/api/validationserverAPI.php"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Linter Check (Biome)
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test
